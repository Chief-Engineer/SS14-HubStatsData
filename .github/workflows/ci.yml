name: CI

on:
  push:
    branches: [main]
    paths: [config.yaml]
  pull_request:
    branches: [main]
    paths: [config.yaml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Pin validator to base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git checkout "${{ github.event.pull_request.base.sha }}" -- validate_config.py

      - name: Validate config
        run: python validate_config.py --config config.yaml
